<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .app {
      width: 100%;
      max-width: 640px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
    }

    /* --- Date warning banner --- */
    .date-warning {
      background: #3a2a12;
      border: 1px solid #b8731f;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .date-warning-text {
      font-size: 0.9rem;
      color: #ffd9a8;
    }

    .date-warning-text strong {
      color: #ffb960;
    }

    .btn-jump-today {
      background: #b8731f;
      color: #fff;
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-jump-today:hover { background: #d18828; }

    /* --- Timer Section --- */
    .timer-section {
      background: #1a1d27;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid #2a2d3a;
    }

    .timer-display {
      font-size: 3rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .task-input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .task-input-row input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #3a3d4a;
      background: #12141c;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .task-input-row input:focus { border-color: #5b8def; }
    .task-input-row input::placeholder { color: #666; }

    .tag-input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tag-input-row input {
      flex: 1;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #3a3d4a;
      background: #12141c;
      color: #e0e0e0;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .tag-input-row input:focus { border-color: #5b8def; }
    .tag-input-row input::placeholder { color: #555; }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-start { background: #22c55e; color: #fff; }
    .btn-start:hover { background: #1fad53; }

    .btn-stop { background: #ef4444; color: #fff; }
    .btn-stop:hover { background: #dc2626; }

    .btn-secondary { background: #2a2d3a; color: #ccc; }
    .btn-secondary:hover { background: #353849; }

    .btn-export { background: #3b82f6; color: #fff; }
    .btn-export:hover { background: #2563eb; }

    .btn-save-day {
      background: #8b5cf6;
      color: #fff;
    }
    .btn-save-day:hover { background: #7c3aed; }

    .active-task {
      text-align: center;
      color: #9ca3af;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .active-task span { color: #5b8def; font-weight: 500; }

    .stopped-at {
      text-align: center;
      color: #9ca3af;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    .stopped-at span { color: #ef8b44; font-weight: 500; }

    /* --- Tags --- */
    .tag {
      display: inline-block;
      background: #2a2d3a;
      color: #9ca3af;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      margin-right: 4px;
      margin-top: 4px;
    }

    .tag-list {
      margin-top: 4px;
      line-height: 1.8;
    }

    /* --- Sections --- */
    .panel {
      background: #1a1d27;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #2a2d3a;
      margin-bottom: 16px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .panel-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .panel-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .log-empty {
      text-align: center;
      color: #555;
      padding: 32px 0;
      font-size: 0.9rem;
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
    }

    .log-table th {
      text-align: left;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      padding: 0 0 10px 0;
      border-bottom: 1px solid #2a2d3a;
    }

    .log-table th:last-child { text-align: right; }

    .log-table td {
      padding: 10px 0;
      border-bottom: 1px solid #1f2230;
      font-size: 0.9rem;
      vertical-align: top;
    }

    .log-table td:last-child {
      font-variant-numeric: tabular-nums;
      color: #9ca3af;
    }

    .log-table tr:last-child td { border-bottom: none; }

    .total-row {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #2a2d3a;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      color: #fff;
      font-size: 0.95rem;
    }

    /* --- Resume / delete buttons in log --- */
    .btn-resume {
      background: none;
      border: 1px solid #3a3d4a;
      color: #9ca3af;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn-resume:hover {
      background: #22c55e22;
      border-color: #22c55e;
      color: #22c55e;
    }

    .btn-resume:disabled {
      opacity: 0.3;
      cursor: default;
      background: none;
      border-color: #3a3d4a;
      color: #9ca3af;
    }

    .btn-delete {
      background: none;
      border: 1px solid #3a3d4a;
      color: #9ca3af;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn-delete:hover {
      background: #ef444422;
      border-color: #ef4444;
      color: #ef4444;
    }

    .log-table td.duration-cell {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #9ca3af;
      white-space: nowrap;
    }

    .log-table td.duration-cell .duration-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .entry-active td:first-child .task-name-display { color: #22c55e; }

    .task-name-display {
      cursor: pointer;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.15s;
    }

    .task-name-display:hover { border-bottom-color: #5b8def; }

    .task-edit-input {
      background: #12141c;
      border: 1px solid #5b8def;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 0.9rem;
      padding: 2px 6px;
      width: 100%;
      outline: none;
    }

    .tags-edit-input {
      background: #12141c;
      border: 1px solid #5b8def;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 0.75rem;
      padding: 2px 6px;
      width: 100%;
      outline: none;
      margin-top: 4px;
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    /* --- Month view --- */
    .month-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .month-label {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      min-width: 140px;
      text-align: center;
    }

    .btn-arrow {
      background: #2a2d3a;
      color: #ccc;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-arrow:hover { background: #353849; }

    .day-list { width: 100%; }

    .day-row {
      display: grid;
      grid-template-columns: 130px 80px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 8px;
      border-bottom: 1px solid #1f2230;
      cursor: pointer;
      transition: background 0.15s;
    }

    .day-row:hover { background: #20232f; }
    .day-row:last-child { border-bottom: none; }

    .day-row.is-today { background: #16332e; }
    .day-row.is-today:hover { background: #1c4036; }

    .day-row-date { color: #e0e0e0; font-weight: 500; }
    .day-row-date .saved-mark {
      display: inline-block;
      margin-left: 6px;
      color: #22c55e;
      font-size: 0.85rem;
    }

    .day-row-hours {
      font-variant-numeric: tabular-nums;
      color: #9ca3af;
      text-align: right;
    }

    .day-row-desc {
      color: #9ca3af;
      font-size: 0.88rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .day-row-desc.empty {
      color: #4a4d5a;
      font-style: italic;
    }

    .day-row-arrow { color: #555; font-size: 1rem; }

    /* --- Modal --- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }

    .modal h2 {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 6px;
    }

    .modal-subtitle {
      color: #9ca3af;
      font-size: 0.88rem;
      margin-bottom: 18px;
    }

    .modal textarea {
      width: 100%;
      background: #12141c;
      border: 1px solid #3a3d4a;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: vertical;
      min-height: 90px;
      outline: none;
      margin-top: 6px;
    }

    .modal textarea:focus { border-color: #5b8def; }

    .modal label {
      display: block;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-top: 14px;
    }

    .modal-summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }

    .modal-summary-table td {
      padding: 6px 0;
      font-size: 0.88rem;
      border-bottom: 1px solid #1f2230;
    }
    .modal-summary-table tr:last-child td { border-bottom: none; }
    .modal-summary-table td:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #9ca3af;
    }

    .modal-total {
      display: flex;
      justify-content: space-between;
      padding-top: 10px;
      margin-top: 6px;
      border-top: 1px solid #2a2d3a;
      font-weight: 600;
      color: #fff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn-confirm { background: #22c55e; color: #fff; }
    .btn-confirm:hover { background: #1fad53; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-header">
      <h1 id="appTitle">Time Tracker</h1>
      <div class="panel-actions">
        <button class="btn btn-sm btn-secondary" id="viewToggleBtn" onclick="toggleView()">Month View</button>
      </div>
    </div>

    <!-- =========== DAY VIEW =========== -->
    <div id="dayView">

      <!-- Date warning -->
      <div id="dateWarning" class="date-warning hidden">
        <div class="date-warning-text">
          Viewing <strong id="warningDateLabel"></strong> &mdash; not the current day. New tracked time will be logged to this day.
        </div>
        <button class="btn-jump-today" onclick="jumpToToday()">Jump to today</button>
      </div>

      <!-- Timer -->
      <div class="timer-section">
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <div class="task-input-row">
          <input type="text" id="taskInput" placeholder="What are you working on?" />
          <button class="btn btn-start" id="startBtn" onclick="startTimer()">Start</button>
          <button class="btn btn-stop" id="stopBtn" onclick="stopTimer()" style="display:none;">Stop</button>
        </div>
        <div class="tag-input-row">
          <input type="text" id="tagInput" placeholder="Tags (optional, comma-separated)" />
        </div>
        <div class="active-task" id="activeLabel" style="display:none;">
          Tracking: <span id="activeTaskName"></span>
        </div>
        <div class="stopped-at" id="stoppedAtLabel" style="display:none;">
          Stopped at <span id="stoppedAtTime"></span>
        </div>
      </div>

      <!-- Activity Log -->
      <div class="panel">
        <div class="panel-header">
          <h2 id="dayLogTitle">Today's Activities</h2>
          <div class="panel-actions">
            <button class="btn btn-sm btn-secondary" onclick="clearDay()">Clear day</button>
            <button class="btn btn-sm btn-secondary" onclick="document.getElementById('csvFileInput').click()">Import</button>
            <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="importCSV(event)" />
            <button class="btn btn-sm btn-save-day" onclick="openSaveDayModal()">Save day</button>
          </div>
        </div>
        <div id="logContent">
          <div class="log-empty">No activities recorded yet. Start a timer above.</div>
        </div>
      </div>
    </div>

    <!-- =========== MONTH VIEW =========== -->
    <div id="monthView" class="hidden">
      <div class="panel">
        <div class="panel-header">
          <div class="month-nav">
            <button class="btn-arrow" onclick="changeMonth(-1)">&lsaquo;</button>
            <div class="month-label" id="monthLabel"></div>
            <button class="btn-arrow" onclick="changeMonth(1)">&rsaquo;</button>
          </div>
          <div class="panel-actions">
            <button class="btn btn-sm btn-export" onclick="exportDetailedLog()">Detailed Log</button>
          </div>
        </div>
        <div id="monthContent"></div>
      </div>
    </div>

    <!-- =========== SAVE DAY MODAL =========== -->
    <div id="saveDayModal" class="modal-backdrop hidden" onclick="closeSaveDayModalIfBackdrop(event)">
      <div class="modal">
        <h2>Save Day</h2>
        <div class="modal-subtitle" id="saveDaySubtitle"></div>

        <div id="saveDaySummary"></div>

        <label for="saveDayDescription">Description for the day</label>
        <textarea id="saveDayDescription" placeholder="e.g. General Chemistry editing; Q28 slide review"></textarea>

        <div class="modal-actions">
          <button class="btn btn-sm btn-secondary" onclick="closeSaveDayModal()">Cancel</button>
          <button class="btn btn-sm btn-export" onclick="exportDayCSVFromModal()">Export day to CSV</button>
          <button class="btn btn-sm btn-confirm" onclick="confirmSaveDay()">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============ STATE ============
    let timerInterval = null;
    let timerStart = null;
    let timerOffset = 0;
    let currentTask = null;
    let resumingId = null;       // entry id being resumed, or null
    let timerEntryDate = null;   // which date the running timer will log to

    let entries = [];            // [{ id, date, task, ms, tags }]
    let days = {};               // { "YYYY-MM-DD": { description, savedAt } }
    let selectedDate = null;     // which day the day view shows
    let view = 'day';            // 'day' | 'month'
    let monthCursor = null;      // "YYYY-MM"

    // ============ DATE / ID HELPERS ============
    function getLocalDate(d) {
      const date = d || new Date();
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    function formatDateLabel(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatDateShort(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function getMonthCursor(iso) {
      return iso.slice(0, 7); // "YYYY-MM"
    }

    function formatMonthLabel(cursor) {
      const [y, m] = cursor.split('-').map(Number);
      return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    // ============ MIGRATION ============
    function migrateState(state) {
      const out = {
        entries: [],
        days: state.days && typeof state.days === 'object' ? { ...state.days } : {},
        selectedDate: state.selectedDate || null,
        view: state.view === 'month' ? 'month' : 'day',
        monthCursor: state.monthCursor || null,
        timer: state.timer || null
      };

      if (Array.isArray(state.entries)) {
        // Capture any per-entry descriptions (legacy) and roll them into the day's
        // description so prior data isn't silently lost.
        const legacyDescByDate = {};
        for (const e of state.entries) {
          if (e && e.description && e.date) {
            (legacyDescByDate[e.date] = legacyDescByDate[e.date] || []).push(e.description);
          }
        }
        for (const [date, descs] of Object.entries(legacyDescByDate)) {
          if (!out.days[date]) {
            const merged = Array.from(new Set(descs)).join('; ');
            if (merged) out.days[date] = { description: merged, savedAt: null };
          }
        }

        out.entries = state.entries.map(e => ({
          id: e.id || generateId(),
          date: e.date || getLocalDate(),
          task: e.task || '',
          ms: e.ms || 0,
          tags: Array.isArray(e.tags) ? e.tags : []
        }));
      }

      return out;
    }

    // ============ STATE PERSISTENCE ============
    const STORAGE_KEY = 'timetracker_state';

    function saveState() {
      const state = {
        entries,
        days,
        selectedDate,
        view,
        monthCursor,
        timer: timerStart ? {
          start: timerStart,
          task: document.getElementById('taskInput').value.trim() || currentTask,
          tags: document.getElementById('tagInput').value,
          resumingId,
          offset: timerOffset,
          entryDate: timerEntryDate
        } : null
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Storage full or unavailable — silently ignore
      }
    }

    function loadState() {
      let raw = null;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch (e) { /* ignore */ }

      const today = getLocalDate();
      let state = { entries: [], days: {}, selectedDate: today, view: 'day', monthCursor: getMonthCursor(today), timer: null };

      if (raw) {
        try { state = migrateState(JSON.parse(raw)); }
        catch (e) { /* corrupt — start fresh */ }
      }

      entries = state.entries;
      days = state.days;
      selectedDate = state.selectedDate || today;
      view = state.view || 'day';
      monthCursor = state.monthCursor || getMonthCursor(selectedDate);

      // Restore running timer
      if (state.timer && state.timer.start) {
        const input = document.getElementById('taskInput');
        const tagInput = document.getElementById('tagInput');
        input.value = state.timer.task || '';
        tagInput.value = state.timer.tags || '';
        resumingId = state.timer.resumingId || null;
        timerOffset = state.timer.offset || 0;
        timerEntryDate = state.timer.entryDate || selectedDate;
        currentTask = state.timer.task;
        timerStart = state.timer.start;

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = '';
        document.getElementById('activeLabel').style.display = '';
        document.getElementById('activeTaskName').textContent = currentTask;

        timerInterval = setInterval(updateDisplay, 1000);
        updateDisplay();
      }

      renderAll();
    }

    // ============ VIEW ROUTING ============
    function renderAll() {
      const dayEl = document.getElementById('dayView');
      const monthEl = document.getElementById('monthView');
      const toggleBtn = document.getElementById('viewToggleBtn');

      if (view === 'month') {
        dayEl.classList.add('hidden');
        monthEl.classList.remove('hidden');
        toggleBtn.textContent = 'Day View';
        renderMonthView();
      } else {
        dayEl.classList.remove('hidden');
        monthEl.classList.add('hidden');
        toggleBtn.textContent = 'Month View';
        renderDayView();
      }
    }

    function toggleView() {
      view = view === 'day' ? 'month' : 'day';
      if (view === 'month') monthCursor = getMonthCursor(selectedDate);
      saveState();
      renderAll();
    }

    function openDay(date) {
      selectedDate = date;
      view = 'day';
      saveState();
      renderAll();
    }

    function jumpToToday() {
      selectedDate = getLocalDate();
      saveState();
      renderAll();
    }

    // ============ DAY VIEW RENDER ============
    function renderDayView() {
      const today = getLocalDate();
      const isToday = selectedDate === today;

      // Title
      document.getElementById('dayLogTitle').textContent = isToday
        ? "Today's Activities"
        : `Activities for ${formatDateLabel(selectedDate)}`;

      // Warning banner
      const warning = document.getElementById('dateWarning');
      if (isToday) {
        warning.classList.add('hidden');
      } else {
        warning.classList.remove('hidden');
        document.getElementById('warningDateLabel').textContent = formatDateLabel(selectedDate);
      }

      renderLog();
    }

    function getDayEntries(date) {
      return entries.filter(e => e.date === date);
    }

    function getDayTotalMs(date) {
      return getDayEntries(date).reduce((sum, e) => sum + e.ms, 0);
    }

    function renderLog() {
      const container = document.getElementById('logContent');
      const dayEntries = getDayEntries(selectedDate);

      if (dayEntries.length === 0) {
        container.innerHTML = '<div class="log-empty">No activities recorded for this day.</div>';
        return;
      }

      const isRunning = timerStart !== null;
      const totalMs = dayEntries.reduce((sum, e) => sum + e.ms, 0);

      let html = '<table class="log-table"><thead><tr><th>Task</th><th>Duration</th></tr></thead><tbody>';
      for (const entry of dayEntries) {
        const isActive = isRunning && resumingId === entry.id;
        html += `<tr${isActive ? ' class="entry-active"' : ''}>`;
        html += `<td>`;
        html += `<span class="task-name-display" onclick="editEntry('${entry.id}')" title="Click to edit">${escapeHTML(entry.task)}</span>`;
        html += renderTags(entry.tags);
        html += `</td>`;
        html += `<td class="duration-cell"><div class="duration-row">`;
        html += `<button class="btn-resume" onclick="resumeEntry('${entry.id}')"${isRunning ? ' disabled' : ''}>Resume</button>`;
        html += `<button class="btn-delete" onclick="deleteEntry('${entry.id}')"${isActive ? ' disabled' : ''}>&#x2715;</button>`;
        html += `<span>${formatTime(entry.ms)}</span>`;
        html += `</div></td>`;
        html += `</tr>`;
      }
      html += '</tbody></table>';
      html += `<div class="total-row"><span>Total</span><span>${formatTime(totalMs)}</span></div>`;

      container.innerHTML = html;
    }

    function renderTags(tags) {
      if (!tags || tags.length === 0) return '';
      return '<div class="tag-list">' + tags.map(t => `<span class="tag">${escapeHTML(t)}</span>`).join('') + '</div>';
    }

    // ============ MONTH VIEW RENDER ============
    function changeMonth(delta) {
      const [y, m] = monthCursor.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      monthCursor = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      saveState();
      renderMonthView();
    }

    function getDaysInMonth(cursor) {
      // Returns sorted list of date strings in this month that have entries OR a saved description.
      const dates = new Set();
      for (const e of entries) {
        if (e.date && e.date.startsWith(cursor)) dates.add(e.date);
      }
      for (const date of Object.keys(days)) {
        if (date.startsWith(cursor)) dates.add(date);
      }
      return Array.from(dates).sort();
    }

    function renderMonthView() {
      document.getElementById('monthLabel').textContent = formatMonthLabel(monthCursor);
      const container = document.getElementById('monthContent');
      const dates = getDaysInMonth(monthCursor);
      const today = getLocalDate();

      if (dates.length === 0) {
        container.innerHTML = '<div class="log-empty">No activity recorded in this month.</div>';
        return;
      }

      let totalMs = 0;
      let html = '<div class="day-list">';
      for (const date of dates) {
        const ms = getDayTotalMs(date);
        totalMs += ms;
        const day = days[date];
        const desc = day && day.description ? day.description : '';
        const saved = day && day.savedAt;
        const todayClass = date === today ? ' is-today' : '';
        html += `<div class="day-row${todayClass}" onclick="openDay('${date}')">`;
        html += `<div class="day-row-date">${escapeHTML(formatDateShort(date))}${saved ? '<span class="saved-mark" title="Saved">✓</span>' : ''}</div>`;
        html += `<div class="day-row-hours">${(ms / 3600000).toFixed(2)} h</div>`;
        html += `<div class="day-row-desc${desc ? '' : ' empty'}">${desc ? escapeHTML(desc) : 'No description'}</div>`;
        html += `<div class="day-row-arrow">›</div>`;
        html += `</div>`;
      }
      html += '</div>';
      html += `<div class="total-row"><span>Month Total</span><span>${(totalMs / 3600000).toFixed(2)} h</span></div>`;

      container.innerHTML = html;
    }

    // ============ TIMER ============
    function startTimer() {
      const input = document.getElementById('taskInput');
      const name = input.value.trim();
      if (!name) {
        input.focus();
        return;
      }

      currentTask = name;
      timerStart = Date.now();
      timerEntryDate = selectedDate;

      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = '';
      document.getElementById('activeLabel').style.display = '';
      document.getElementById('stoppedAtLabel').style.display = 'none';
      document.getElementById('activeTaskName').textContent = name;

      renderLog();
      saveState();
      timerInterval = setInterval(updateDisplay, 1000);
      updateDisplay();
    }

    function resumeEntry(id) {
      if (timerStart) return;
      const entry = entries.find(e => e.id === id);
      if (!entry) return;

      resumingId = id;
      timerOffset = entry.ms;

      const input = document.getElementById('taskInput');
      const tagInput = document.getElementById('tagInput');
      input.value = entry.task;
      tagInput.value = (entry.tags || []).join(', ');

      // Resume always logs to the entry's own date (so you can pick up an old day's task)
      const prevSelected = selectedDate;
      selectedDate = entry.date;
      startTimer();
      // If user was viewing a different day, jump to the entry's day so they can see the timer running
      if (prevSelected !== entry.date) renderDayView();
    }

    function stopTimer() {
      if (!timerStart) return;

      const input = document.getElementById('taskInput');
      const finalName = input.value.trim() || currentTask;
      const tagInput = document.getElementById('tagInput');
      const tags = parseTags(tagInput.value);
      const elapsed = Date.now() - timerStart;
      const targetDate = timerEntryDate || selectedDate;

      if (resumingId !== null) {
        const existing = entries.find(e => e.id === resumingId);
        if (existing && existing.date === targetDate) {
          // Same day: merge time into existing entry
          existing.ms += elapsed;
          existing.task = finalName;
          existing.tags = tags;
        } else {
          // Different day: create a new entry for the target date
          entries.push({
            id: generateId(),
            date: targetDate,
            task: finalName,
            ms: elapsed,
            tags
          });
        }
        resumingId = null;
      } else {
        // If a same-task entry already exists for the target date, merge
        const existing = entries.find(e =>
          e.date === targetDate && e.task.toLowerCase() === finalName.toLowerCase()
        );
        if (existing) {
          existing.ms += elapsed;
          existing.task = finalName;
          existing.tags = tags;
        } else {
          entries.push({
            id: generateId(),
            date: targetDate,
            task: finalName,
            ms: elapsed,
            tags
          });
        }
      }

      clearInterval(timerInterval);
      timerInterval = null;
      timerStart = null;
      timerOffset = 0;
      currentTask = null;
      timerEntryDate = null;

      document.getElementById('timerDisplay').textContent = '00:00:00';
      document.getElementById('startBtn').style.display = '';
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('activeLabel').style.display = 'none';

      // Show "Stopped at" timestamp
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      const dateStr = now.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' });
      document.getElementById('stoppedAtTime').textContent = `${timeStr}, ${dateStr}`;
      document.getElementById('stoppedAtLabel').style.display = '';

      input.value = '';
      tagInput.value = '';
      input.focus();

      renderLog();
      saveState();
    }

    document.getElementById('taskInput').addEventListener('input', function() {
      if (timerStart) {
        document.getElementById('activeTaskName').textContent = this.value.trim() || currentTask;
      }
    });

    function updateDisplay() {
      if (!timerStart) return;
      const elapsed = Date.now() - timerStart + timerOffset;
      document.getElementById('timerDisplay').textContent = formatTime(elapsed);
    }

    document.getElementById('taskInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !timerStart) startTimer();
    });

    function parseTags(str) {
      return str.split(',').map(t => t.trim()).filter(t => t.length > 0);
    }

    // ============ EDIT / DELETE ENTRY ============
    function editEntry(id) {
      const entry = entries.find(e => e.id === id);
      if (!entry) return;

      // Find row in current rendered table
      const rows = document.querySelectorAll('.log-table tbody tr');
      const dayEntries = getDayEntries(selectedDate);
      const idx = dayEntries.findIndex(e => e.id === id);
      if (idx === -1 || !rows[idx]) return;

      const cell = rows[idx].querySelector('td');

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.className = 'task-edit-input';
      nameInput.value = entry.task;

      const tagsInput = document.createElement('input');
      tagsInput.type = 'text';
      tagsInput.className = 'tags-edit-input';
      tagsInput.value = (entry.tags || []).join(', ');
      tagsInput.placeholder = 'Tags (optional, comma-separated)';

      cell.innerHTML = '';
      cell.appendChild(nameInput);
      cell.appendChild(tagsInput);
      nameInput.focus();
      nameInput.select();

      function save() {
        const newName = nameInput.value.trim();
        if (newName) entry.task = newName;
        entry.tags = parseTags(tagsInput.value);
        renderLog();
        saveState();
      }

      const inputs = [nameInput, tagsInput];
      inputs.forEach(input => {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') save();
          if (e.key === 'Escape') renderLog();
        });
        input.addEventListener('blur', function() {
          setTimeout(() => {
            if (!inputs.includes(document.activeElement)) save();
          }, 100);
        });
      });
    }

    function deleteEntry(id) {
      if (resumingId === id && timerStart) return;
      const idx = entries.findIndex(e => e.id === id);
      if (idx === -1) return;
      entries.splice(idx, 1);
      renderLog();
      saveState();
    }

    function clearDay() {
      const dayEntries = getDayEntries(selectedDate);
      if (dayEntries.length === 0 && !days[selectedDate]) return;
      if (!confirm(`Clear all activities and saved description for ${formatDateLabel(selectedDate)}?`)) return;
      entries = entries.filter(e => e.date !== selectedDate);
      delete days[selectedDate];
      renderLog();
      saveState();
    }

    // ============ SAVE DAY MODAL ============
    function openSaveDayModal() {
      const dayEntries = getDayEntries(selectedDate);
      if (dayEntries.length === 0) {
        alert('No activities recorded for this day.');
        return;
      }

      document.getElementById('saveDaySubtitle').textContent = formatDateLabel(selectedDate);

      // Summary table — group by task (collapse multi-session same-task)
      const grouped = new Map();
      for (const e of dayEntries) {
        const key = e.task.toLowerCase();
        let row = grouped.get(key);
        if (!row) {
          row = { task: e.task, ms: 0 };
          grouped.set(key, row);
        }
        row.ms += e.ms;
      }
      const rows = Array.from(grouped.values());
      let totalMs = 0;
      let html = '<table class="modal-summary-table"><tbody>';
      for (const r of rows) {
        totalMs += r.ms;
        html += `<tr><td>${escapeHTML(r.task)}</td><td>${formatTime(r.ms)}</td></tr>`;
      }
      html += '</tbody></table>';
      html += `<div class="modal-total"><span>Total</span><span>${(totalMs / 3600000).toFixed(2)} h (${formatTime(totalMs)})</span></div>`;
      document.getElementById('saveDaySummary').innerHTML = html;

      // Pre-fill description
      const existing = days[selectedDate];
      document.getElementById('saveDayDescription').value = existing && existing.description ? existing.description : '';

      document.getElementById('saveDayModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('saveDayDescription').focus(), 50);
    }

    function closeSaveDayModal() {
      document.getElementById('saveDayModal').classList.add('hidden');
    }

    function closeSaveDayModalIfBackdrop(event) {
      if (event.target.id === 'saveDayModal') closeSaveDayModal();
    }

    function confirmSaveDay() {
      const description = document.getElementById('saveDayDescription').value.trim();
      days[selectedDate] = {
        description,
        savedAt: Date.now()
      };
      saveState();
      closeSaveDayModal();
      // If month view is what they'll go to next, no harm; otherwise just stay on day view.
    }

    function exportDayCSVFromModal() {
      exportDayCSV(selectedDate);
    }

    // ============ EXPORTS ============
    function exportDayCSV(date) {
      const dayEntries = getDayEntries(date);
      if (dayEntries.length === 0) {
        alert('No activities to export for this day.');
        return;
      }
      const grouped = collapseToPerTaskPerDay(dayEntries);
      const day = days[date];
      const desc = day && day.description ? day.description : '';

      const BOM = '﻿';
      let csv = 'Date,Task,Duration (hours),Duration (HH:MM:SS),Tags,Day Description\n';
      for (const r of grouped) {
        const hours = (r.ms / 3600000).toFixed(2);
        const tags = Array.from(r.tags).join('; ');
        csv += `${r.date},${csvEscape(r.task)},${hours},${formatTime(r.ms)},${csvEscape(tags)},${csvEscape(desc)}\n`;
      }
      downloadCSV(csv, `time-tracker-day-${date}.csv`, BOM);
    }

    function exportDetailedLog() {
      const monthEntries = entries.filter(e => e.date.startsWith(monthCursor));
      if (monthEntries.length === 0) {
        alert('No activities recorded in this month.');
        return;
      }
      const grouped = collapseToPerTaskPerDay(monthEntries);

      const BOM = '﻿';
      let csv = 'Date,Task,Duration (hours),Duration (HH:MM:SS),Tags,Day Description\n';
      let totalMs = 0;
      for (const r of grouped) {
        const hours = (r.ms / 3600000).toFixed(2);
        const tags = Array.from(r.tags).join('; ');
        const day = days[r.date];
        const desc = day && day.description ? day.description : '';
        csv += `${r.date},${csvEscape(r.task)},${hours},${formatTime(r.ms)},${csvEscape(tags)},${csvEscape(desc)}\n`;
        totalMs += r.ms;
      }
      csv += `,Month Total,${(totalMs / 3600000).toFixed(2)},${formatTime(totalMs)},,\n`;
      downloadCSV(csv, `time-tracker-detailed-${monthCursor}.csv`, BOM);
    }

    function collapseToPerTaskPerDay(entryList) {
      const grouped = new Map();
      for (const e of entryList) {
        const key = `${e.date}␀${e.task.toLowerCase()}`;
        let row = grouped.get(key);
        if (!row) {
          row = { date: e.date, task: e.task, ms: 0, tags: new Set() };
          grouped.set(key, row);
        }
        row.ms += e.ms;
        if (e.tags) e.tags.forEach(t => row.tags.add(t));
      }
      return Array.from(grouped.values()).sort((a, b) => {
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        return a.task.localeCompare(b.task);
      });
    }

    function downloadCSV(csv, filename, bom) {
      const blob = new Blob([(bom || '') + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ============ CSV IMPORT ============
    function importCSV(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const imported = parseCSV(text);
        if (imported.length === 0) {
          alert('No valid entries found in the CSV file.');
          return;
        }

        // Aggregate existing entries by (date, task_lower) so we can detect
        // duplicates against the collapsed-per-day form the exporter emits.
        const existingByKey = new Map();
        for (const e of entries) {
          const key = `${e.date}${e.task.toLowerCase()}`;
          existingByKey.set(key, (existingByKey.get(key) || 0) + e.ms);
        }
        // Aggregate the import the same way so multi-row imports for the same
        // (date, task) compare against their summed duration.
        const importedByKey = new Map();
        for (const r of imported) {
          const key = `${r.date}${r.task.toLowerCase()}`;
          importedByKey.set(key, (importedByKey.get(key) || 0) + r.ms);
        }

        const skipKeys = new Set();
        let skipped = 0;
        for (const [key, importedMs] of importedByKey) {
          const existingMs = existingByKey.get(key);
          if (existingMs == null) continue;
          // Compare at 2-decimal hour precision — that's the export's resolution.
          const importedH = Math.round(importedMs / 36000) / 100;
          const existingH = Math.round(existingMs / 36000) / 100;
          if (importedH === existingH) {
            skipKeys.add(key);
            skipped++;
          }
        }

        const toAdd = imported.filter(r =>
          !skipKeys.has(`${r.date}${r.task.toLowerCase()}`)
        );
        entries.push(...toAdd);
        renderAll();
        saveState();

        if (skipped > 0 && toAdd.length === 0) {
          alert(`Skipped ${skipped} duplicate ${skipped === 1 ? 'entry' : 'entries'} — nothing new to import.`);
        } else if (skipped > 0) {
          alert(`Imported ${toAdd.length} ${toAdd.length === 1 ? 'entry' : 'entries'}; skipped ${skipped} duplicate ${skipped === 1 ? 'entry' : 'entries'}.`);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function parseCSV(text) {
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      const lines = text.split('\n');
      if (lines.length === 0) return [];

      const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
      const col = (name) => header.findIndex(h => h === name.toLowerCase());
      const idx = {
        date: col('Date'),
        task: col('Task'),
        durationHours: header.findIndex(h => h.startsWith('duration (hours)')),
        durationHMS: header.findIndex(h => h.startsWith('duration (hh')),
        durationLegacy: col('Duration'),
        tags: col('Tags'),
        dayDescription: col('Day Description')
      };

      const results = [];
      const importedDescByDate = {};
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].replace(/\r$/, '');
        if (!line.trim()) continue;
        const fields = parseCSVLine(line);
        const get = (j) => (j >= 0 && j < fields.length ? fields[j] : '');

        const task = (get(idx.task) || '').trim();
        if (!task) continue;

        let ms = 0;
        if (idx.durationHMS >= 0) ms = parseTime(get(idx.durationHMS));
        if (!ms && idx.durationHours >= 0) {
          const h = parseFloat(get(idx.durationHours));
          if (!isNaN(h)) ms = Math.round(h * 3600000);
        }
        if (!ms && idx.durationLegacy >= 0) ms = parseTime(get(idx.durationLegacy));
        if (ms <= 0) continue;

        const date = (get(idx.date) || '').trim() || getLocalDate();
        const tagsStr = get(idx.tags) || '';
        const tags = tagsStr ? tagsStr.split(';').map(t => t.trim()).filter(Boolean) : [];

        const dayDesc = (get(idx.dayDescription) || '').trim();
        if (dayDesc && !importedDescByDate[date]) {
          importedDescByDate[date] = dayDesc;
        }

        results.push({ id: generateId(), date, task, ms, tags });
      }

      // Only populate day descriptions for dates that don't already have one
      for (const [date, desc] of Object.entries(importedDescByDate)) {
        if (!days[date] || !days[date].description) {
          days[date] = {
            description: desc,
            savedAt: days[date] ? days[date].savedAt : null
          };
        }
      }

      return results;
    }

    function parseCSVLine(line) {
      const fields = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"') {
            if (i + 1 < line.length && line[i + 1] === '"') { current += '"'; i++; }
            else { inQuotes = false; }
          } else { current += ch; }
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === ',') { fields.push(current); current = ''; }
          else current += ch;
        }
      }
      fields.push(current);
      return fields;
    }

    function parseTime(str) {
      const parts = str.split(':');
      if (parts.length !== 3) return 0;
      const h = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const s = parseInt(parts[2], 10);
      if (isNaN(h) || isNaN(m) || isNaN(s)) return 0;
      return ((h * 3600) + (m * 60) + s) * 1000;
    }

    // ============ UTIL ============
    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function csvEscape(str) {
      if (str == null) return '';
      str = String(str);
      if (str.includes(',') || str.includes('"') || str.includes('\n')) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    }

    // ============ INIT ============
    loadState();
  </script>
</body>
</html>
